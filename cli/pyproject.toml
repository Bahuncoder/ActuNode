[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "actunode"
dynamic = ["version"]
description = "Scenario tests for VDA 5050 / MQTT robot integrations, run against an ActuNode lab"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.7,<3", "PyYAML>=6.0.1,<7", "websockets>=13,<16"]

[project.scripts]
actunode = "actunode.cli:main"

[tool.setuptools]
packages = ["actunode"]

[tool.setuptools.dynamic]
version = { attr = "actunode.__version__" }
