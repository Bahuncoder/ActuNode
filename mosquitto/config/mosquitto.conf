# ActuNode broker. Every client must log in; what each may do is in the ACL that
# mqtt-init builds from acl plus one block per robot login (D-23, D-28).
# Credentials are generated on first start by mosquitto/init-secrets.sh into the mqtt-secrets volume.

# Settings are per listener (I7): the network listener 8883 has its own, smaller password file.
per_listener_settings true

# Resource limits (I1). One login must not be able to exhaust the broker: topics are bounded by the ACL
# (explicit VDA major versions, see init-secrets.sh), memory and queues by these settings.
memory_limit 268435456
max_queued_messages 1000
max_queued_bytes 16777216
max_inflight_messages 20
# Largest MQTT packet accepted, from any client (256 KiB). VDA 5050 messages are a few KB; without a limit
# one robot login could send up to 256 MB and exhaust the backend's memory. The backend enforces the same
# limit on what it parses (MAX_PAYLOAD_BYTES).
max_packet_size 262144

# Inside the Docker network (and 127.0.0.1): the backend, the simulator, the health check and tools.
listener 1883
protocol mqtt
max_connections 200
allow_anonymous false
password_file /mosquitto/secrets/passwd
acl_file /mosquitto/secrets/acl

# WebSocket listener so browser tools can subscribe directly if needed (same logins and permissions).
listener 9001
protocol websockets
max_connections 50
allow_anonymous false
password_file /mosquitto/secrets/passwd
acl_file /mosquitto/secrets/acl

# TLS listener: what real robots on a network use (D-26). Plain 1883/9001 are published on 127.0.0.1
# only; inside the Docker network the backend and simulator use 1883. Its password file has no internal
# logins (backend, health check, simulated robots): they cannot be used from the network (I7).
listener 8883
protocol mqtt
max_connections 200
cafile /mosquitto/secrets/tls/ca.crt
certfile /mosquitto/secrets/tls/server.crt
keyfile /mosquitto/secrets/tls/server.key
tls_version tlsv1.2
# Forward-secret AEAD suites only (the server certificate is ECDSA).
ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305
allow_anonymous false
password_file /mosquitto/secrets/passwd.net
acl_file /mosquitto/secrets/acl

persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
