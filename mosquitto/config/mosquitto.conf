# ActuNode broker. Every client must log in; what each may do is in acl (D-23).
# Credentials are generated on first start by mosquitto/init-secrets.sh into the mqtt-secrets volume.

listener 1883
protocol mqtt

# WebSocket listener so browser tools can subscribe directly if needed (same logins and permissions).
listener 9001
protocol websockets

allow_anonymous false
password_file /mosquitto/secrets/passwd
acl_file /mosquitto/config/acl

persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
