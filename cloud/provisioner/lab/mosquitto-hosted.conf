# A hosted workspace's broker (D-61). Same limits as the lab's own (mosquitto/config/mosquitto.conf); the edge
# (Traefik) terminates TLS for <workspace>.actunode.com:8883 and forwards plain MQTT to 1884.
per_listener_settings true
memory_limit 268435456
max_queued_messages 1000
max_queued_bytes 16777216
max_inflight_messages 20
max_packet_size 262144

# Inside the workspace: the backend, the simulator, the health check.
listener 1883
protocol mqtt
max_connections 100
allow_anonymous false
password_file /mosquitto/secrets/passwd
acl_file /mosquitto/secrets/acl

# From the internet through the edge: robots, fleet managers, tools. Network logins only (passwd.net has no
# internal logins), exactly as the lab's TLS listener 8883.
listener 1884
protocol mqtt
max_connections 100
allow_anonymous false
password_file /mosquitto/secrets/passwd.net
acl_file /mosquitto/secrets/acl

persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
