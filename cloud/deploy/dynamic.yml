# Certificates and shared middlewares (local: a wildcard certificate made by local-up.sh; production: ACME, see
# traefik.prod.yml).
tls:
  # Listed (not only the store default): with sniStrict, Traefik accepts a host name only if a listed certificate covers it.
  certificates:
    - certFile: /certs/wildcard.crt
      keyFile: /certs/wildcard.key
  stores:
    default:
      defaultCertificate:
        certFile: /certs/wildcard.crt
        keyFile: /certs/wildcard.key
  options:
    default:
      minVersion: VersionTLS12
      sniStrict: true
http:
  middlewares:
    secure-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        contentTypeNosniff: true
        referrerPolicy: same-origin
    # Abuse limits per client address (phase 2): people need far less; a stuck script or a scraper gets 429.
    app-limits:
      rateLimit: {average: 20, burst: 60, period: 1s}
    app-body:
      buffering: {maxRequestBodyBytes: 65536}  # the control plane takes small forms only (413 above)
    lab-limits:
      rateLimit: {average: 100, burst: 300, period: 1s}
tcp:
  middlewares:
    mqtt-limits:
      inFlightConn: {amount: 100}  # open MQTT connections per client address (a site's robots share one)
