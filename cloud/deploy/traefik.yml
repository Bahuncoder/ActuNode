# The edge (D-61): TLS for app.<domain> and every <workspace>.<domain>; MQTT over TLS routed by SNI.
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint: {to: websecure, scheme: https}
  websecure:
    address: ":443"
  mqtts:
    address: ":8883"
providers:
  docker:
    endpoint: "tcp://docker-ro:2375"  # read-only Docker API proxy
    exposedByDefault: false
  file:
    filename: /etc/traefik/dynamic.yml
api:
  dashboard: false
log:
  level: INFO
accessLog: {}
