name: Security scans

on:
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC: new advisories appear without any commit
  workflow_dispatch:
  push:
    paths:
      - "backend/requirements*.txt"
      - "simulator/requirements*.txt"
      - "cli/requirements*.txt"
      - "tests/e2e/requirements.txt"
      - "frontend/package*.json"
      - "**/Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/security.yml"
  pull_request:
    paths:
      - "backend/requirements*.txt"
      - "simulator/requirements*.txt"
      - "cli/requirements*.txt"
      - "tests/e2e/requirements.txt"
      - "frontend/package*.json"
      - "**/Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/security.yml"

permissions:
  contents: read

jobs:
  python-deps:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - run: pip install pip-audit==2.10.1
      - run: pip-audit -r backend/requirements.txt
      - run: pip-audit -r simulator/requirements.txt
      - run: pip-audit -r cli/requirements.txt
      - run: pip-audit -r tests/e2e/requirements.txt

  npm-deps:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high

  images:
    runs-on: ubuntu-24.04
    env:
      TRIVY_VERSION: "0.71.2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Trivy (checked against the checksums published with the release)
        run: |
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          deb="trivy_${TRIVY_VERSION}_Linux-64bit.deb"
          curl -fsSL -o "$deb" "$base/$deb"
          curl -fsSL -o checksums.txt "$base/trivy_${TRIVY_VERSION}_checksums.txt"
          grep -F " $deb" checksums.txt | sha256sum -c -
          sudo dpkg -i "$deb"
          trivy --version
      - name: Build images
        run: |
          docker build -t actunode-backend:ci backend
          docker build -t actunode-simulator:ci -f simulator/Dockerfile .
          docker build -t actunode-frontend:ci frontend
          docker build -t actunode-runner:ci cli
      - name: Scan Dockerfiles (Trivy has no Docker Compose checks; the compose file is hardened by hand, see docker-compose.yml)
        run: |
          for dir in backend simulator frontend cli; do
            trivy config --severity HIGH,CRITICAL --exit-code 1 "$dir"
          done
      - name: Scan images
        run: |
          for image in actunode-backend:ci actunode-simulator:ci actunode-frontend:ci actunode-runner:ci eclipse-mosquitto:2 python:3.12-slim; do
            trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$image"
          done
