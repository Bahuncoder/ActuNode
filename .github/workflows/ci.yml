name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.0
      - run: ruff check .
      - run: ruff format --check .

  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  simulator:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r simulator/requirements-dev.txt
      - run: pytest -q simulator

  cli:
    # actunode test, the scenario runner (D-45); its e2e runs in the e2e job below.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r cli/requirements-dev.txt
      - run: pytest -q cli/tests

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    # Builds and runs the real Docker Compose stack (Mosquitto, backend, simulator, nginx),
    # once with robots speaking VDA 5050 2.1.0 and once with 3.0.0 (D-15).
    runs-on: ubuntu-24.04
    needs: [lint, backend, simulator, cli, frontend]
    strategy:
      fail-fast: false
      matrix:
        vda: ["2", "3"]
        login: ["0"]
        include:
          - vda: "2"
            login: "1"  # sharing mode (D-25)
    env:
      ACTUNODE_VDA_VERSION: ${{ matrix.vda }}
      ACTUNODE_REQUIRE_LOGIN: ${{ matrix.login }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r tests/e2e/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: pytest tests/e2e -v
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-container-logs-vda${{ matrix.vda }}-login${{ matrix.login }}
          path: tests/e2e/last-run.log
