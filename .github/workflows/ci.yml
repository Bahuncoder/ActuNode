name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.0
      - run: ruff check .
      - run: ruff format --check .

  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  cloud:
    # The hosted service's control plane (D-61).
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  simulator:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: pip install -r simulator/requirements-dev.txt
      - run: pytest -q simulator

  cli:
    # actunode test, the scenario runner (D-45); its e2e runs in the e2e job below.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: pip install -r cli/requirements-dev.txt
      - run: pytest -q cli/tests

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  scenarios:
    # The Docker scenario runner as a user runs it (D-49): the sample scenarios, then the example fleet manager
    # (its own master control login) against the blocked-path reaction scenario (D-48). The same steps as
    # examples/ci/github-actions.yml. JUnit reports, recordings and logs are kept as artifacts.
    runs-on: ubuntu-24.04
    needs: [lint, backend, simulator, cli, frontend]
    strategy:
      fail-fast: false
      matrix:
        vda: ["2", "3"]
    env:
      ACTUNODE_VDA_VERSION: ${{ matrix.vda }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Run the lab as this user (it writes sessions and reports into the checkout)
        run: |
          echo "ACTUNODE_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "ACTUNODE_GID=$(id -g)" >> "$GITHUB_ENV"
          mkdir -p test-results
      - name: Start the lab
        run: docker compose up -d --build --wait
      - name: Sample scenarios
        run: docker compose run --rm runner test scenarios/ --vda-version "$ACTUNODE_VDA_VERSION" --junit test-results/samples.xml
      - name: A login for the fleet manager under test
        run: |
          docker compose run --rm -T mqtt-init add-master ci | grep -o 'password=[^ ]*' | cut -d= -f2 > "$RUNNER_TEMP/fleet-manager.pw"
          docker compose up -d --force-recreate --wait mqtt-init mosquitto
      - name: Start the fleet manager under test, here the example
        run: |
          pip install "paho-mqtt>=2.1,<3"
          nohup python examples/fleet_manager/fleet_manager.py --user master@ci --password-file "$RUNNER_TEMP/fleet-manager.pw" \
            --vda "$ACTUNODE_VDA_VERSION" --policy cancel --max-seconds 900 > test-results/fleet-manager.log 2>&1 &
      - name: Fleet manager scenarios
        env:
          ACTUNODE_SCENARIOS: ./examples/fleet_manager
        run: docker compose run --rm runner test scenarios/ --vda-version "$ACTUNODE_VDA_VERSION" --junit test-results/fleet-manager.xml
      - name: Summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          print("| Report | Scenarios | Failed | Could not run |\n|---|---|---|---|")
          for path in sorted(glob.glob("test-results/*.xml")):
              s = ET.parse(path).getroot()
              print(f"| {path} | {s.get('tests')} | {s.get('failures')} | {s.get('errors')} |")
          PY
      - name: Lab logs
        if: failure()
        run: docker compose logs --no-color --timestamps > test-results/lab.log
      - name: Keep reports, recordings and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: scenarios-vda${{ matrix.vda }}
          path: |
            test-results/
            sessions/*.jsonl

  e2e:
    # Builds and runs the real Docker Compose stack (Mosquitto, backend, simulator, nginx),
    # once with robots speaking VDA 5050 2.1.0 and once with 3.0.0 (D-15).
    runs-on: ubuntu-24.04
    needs: [lint, backend, simulator, cli, frontend]
    strategy:
      fail-fast: false
      matrix:
        vda: ["2", "3"]
        login: ["0"]
        include:
          - vda: "2"
            login: "1"  # sharing mode (D-25)
    env:
      ACTUNODE_VDA_VERSION: ${{ matrix.vda }}
      ACTUNODE_REQUIRE_LOGIN: ${{ matrix.login }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: pip install -r tests/e2e/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: pytest tests/e2e -v
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-container-logs-vda${{ matrix.vda }}-login${{ matrix.login }}
          path: tests/e2e/last-run.log
