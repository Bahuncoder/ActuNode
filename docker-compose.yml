# One-command local stack: docker compose up --build
# UI:      http://localhost:8080
# API:     http://localhost:8000/docs
# MQTT:    localhost:1883 (ws: 9001)

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: actunode-mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/broker/uptime", "-C", "1", "-W", "3"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: actunode-backend
    environment:
      ACTUNODE_MQTT_HOST: mosquitto
      ACTUNODE_MQTT_PORT: 1883
    ports:
      - "8000:8000"
    depends_on:
      mosquitto:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: actunode-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
