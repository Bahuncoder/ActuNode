# One-command local stack: docker compose up --build
# UI:      http://localhost:8080
# API:     http://localhost:8080/api/docs (direct backend: 127.0.0.1:8000)
# MQTT:    localhost:1883 (ws: 9001)
#
# By default nothing is reachable from the network. The broker requires logins (D-23); the web UI and
# API have a login for sharing (D-25). Sharing the lab: ACTUNODE_BIND_ADDRESS plus ACTUNODE_REQUIRE_LOGIN=1
# (the backend refuses to start with a network bind and no login; see README, "Sharing the lab").
#
# Plain ports (8080, 8000, 1883, 9001) are always published on 127.0.0.1; HTTPS 8443 and MQTT over TLS
# 8883 follow ACTUNODE_BIND_ADDRESS (D-26).
#
# Host ports and the sessions directory can be overridden with environment variables
# (the end-to-end tests use this to run a second, isolated copy). Defaults are shown below.

# Container logs rotate (10 MB × 3 per service): a client sending bad messages at high rate must not be
# able to fill the disk through our error logs.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Creates MQTT logins and the web login token on first start (kept in the secrets volume) and rebuilds the broker's
  # password file and ACL on every start (D-23, D-28). Tools password: docker compose run --rm mqtt-init show tools
  mqtt-init:
    image: eclipse-mosquitto:2
    entrypoint: ["/bin/sh", "/init-secrets.sh"]
    environment:
      BACKEND_UID: ${ACTUNODE_UID:-1000}
      SIMULATOR_UID: 1000
      SIM_MAX_ROBOTS: 50
    volumes:
      - ./mosquitto/init-secrets.sh:/init-secrets.sh:ro
      - ./mosquitto/config/acl:/acl.base:ro
      - secrets:/secrets

  # TLS certificates (D-26): a local CA, made once, and a server certificate for localhost and the
  # names in ACTUNODE_ALLOWED_HOSTS. CA for browsers and robots: docker compose run --rm cert-init show ca
  cert-init:
    image: python:3.12-slim
    entrypoint: ["/bin/sh", "/init-certs.sh"]
    environment:
      ACTUNODE_ALLOWED_HOSTS: ${ACTUNODE_ALLOWED_HOSTS:-localhost,127.0.0.1,::1}
    volumes:
      - ./tls/init-certs.sh:/init-certs.sh:ro
      - secrets:/secrets

  mosquitto:
    logging: *logging
    image: eclipse-mosquitto:2
    # Unencrypted MQTT never leaves this computer; robots on a network use TLS on 8883 (D-26).
    ports:
      - "127.0.0.1:${ACTUNODE_MQTT_HOST_PORT:-1883}:1883"
      - "127.0.0.1:${ACTUNODE_MQTT_WS_HOST_PORT:-9001}:9001"
      - "${ACTUNODE_BIND_ADDRESS:-127.0.0.1}:${ACTUNODE_MQTTS_HOST_PORT:-8883}:8883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/config/acl:/mosquitto/config/acl:ro
      - type: volume
        source: secrets
        target: /mosquitto/secrets
        read_only: true
        volume:
          subpath: broker
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -u healthcheck -P \"$$(cat /mosquitto/secrets/healthcheck.password)\" -t '$$SYS/broker/uptime' -C 1 -W 3"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      mqtt-init:
        condition: service_completed_successfully
      cert-init:
        condition: service_completed_successfully

  backend:
    logging: *logging
    build: ./backend
    # Write session files as the host user, not root. Set ACTUNODE_UID/ACTUNODE_GID
    # if your user id is not 1000 (check with `id -u` and `id -g`).
    user: "${ACTUNODE_UID:-1000}:${ACTUNODE_GID:-1000}"
    environment:
      ACTUNODE_MQTT_HOST: mosquitto
      ACTUNODE_MQTT_PORT: 1883
      ACTUNODE_MQTT_USERNAME: actunode-backend
      ACTUNODE_MQTT_PASSWORD_FILE: /run/secrets/actunode/password
      ACTUNODE_SESSIONS_DIR: /app/sessions
      # Sharing the lab (D-25): the backend refuses to start if ports are published beyond this
      # machine without a login. Token: docker compose run --rm mqtt-init show api-token
      ACTUNODE_BIND_ADDRESS: ${ACTUNODE_BIND_ADDRESS:-127.0.0.1}
      ACTUNODE_REQUIRE_LOGIN: ${ACTUNODE_REQUIRE_LOGIN:-0}
      ACTUNODE_API_TOKEN_FILE: /run/secrets/actunode/api-token
      ACTUNODE_MAX_SESSION_MB: ${ACTUNODE_MAX_SESSION_MB:-200}
      ACTUNODE_PROXIMITY_M: ${ACTUNODE_PROXIMITY_M:-1.0}
      ACTUNODE_SESSIONS_KEEP_DAYS: ${ACTUNODE_SESSIONS_KEEP_DAYS:-30}
      ACTUNODE_SESSIONS_MAX_TOTAL_MB: ${ACTUNODE_SESSIONS_MAX_TOTAL_MB:-2000}
      # Host names the API answers to (D-24); add this machine's name/address when sharing the lab.
      ACTUNODE_ALLOWED_HOSTS: ${ACTUNODE_ALLOWED_HOSTS:-localhost,127.0.0.1,::1}
      ACTUNODE_TRUSTED_PROXIES: ${ACTUNODE_TRUSTED_PROXIES:-frontend}
    ports:
      - "127.0.0.1:${ACTUNODE_API_HOST_PORT:-8000}:8000"  # direct API: this computer only (use the UI port to share)
    volumes:
      - ${ACTUNODE_SESSIONS_HOST_DIR:-./sessions}:/app/sessions
      - type: volume
        source: secrets
        target: /run/secrets/actunode
        read_only: true
        volume:
          subpath: backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      mosquitto:
        condition: service_healthy

  simulator:
    logging: *logging
    build:
      context: .
      dockerfile: simulator/Dockerfile
    environment:
      ACTUNODE_MQTT_HOST: mosquitto
      ACTUNODE_MQTT_PORT: 1883
      ACTUNODE_SIM_ROBOTS: ${ACTUNODE_SIM_ROBOTS:-3}
      ACTUNODE_VDA_VERSION: ${ACTUNODE_VDA_VERSION:-2}
      ACTUNODE_MQTT_PASSWORD_FILE: /run/secrets/actunode/password
    volumes:
      - type: volume
        source: secrets
        target: /run/secrets/actunode
        read_only: true
        volume:
          subpath: simulator
    depends_on:
      mosquitto:
        condition: service_healthy

  frontend:
    logging: *logging
    build: ./frontend
    # Plain HTTP only on this computer; HTTPS (8443) is what a network sees (D-26).
    ports:
      - "127.0.0.1:${ACTUNODE_UI_HOST_PORT:-8080}:80"
      - "${ACTUNODE_BIND_ADDRESS:-127.0.0.1}:${ACTUNODE_UI_TLS_HOST_PORT:-8443}:443"
    # nginx runs as uid 101 (D-12); let it bind 80/443 inside its own network namespace only.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    volumes:
      - type: volume
        source: secrets
        target: /etc/nginx/tls
        read_only: true
        volume:
          subpath: web
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      cert-init:
        condition: service_completed_successfully
      backend:
        condition: service_healthy

  # Scenario tests (D-49), not started by `up`: docker compose run --rm runner test scenarios/
  # It shares the frontend's network namespace, so it reaches the lab as http://localhost (an allowed host name,
  # D-24) without publishing anything. Your own scenarios: ACTUNODE_SCENARIOS=/path/to/dir. JUnit reports and
  # other output: ACTUNODE_RESULTS (default ./test-results; create it first, the runner writes as ACTUNODE_UID).
  runner:
    profiles: ["test"]
    build: ./cli
    network_mode: "service:frontend"
    user: "${ACTUNODE_UID:-1000}:${ACTUNODE_GID:-1000}"
    environment:
      ACTUNODE_URL: http://localhost
      # The web login token, used only when the lab requires login (D-25); the runner gets no MQTT password.
      ACTUNODE_TOKEN_FILE: /run/actunode/api-token
    volumes:
      - type: volume
        source: secrets
        target: /run/actunode/api-token
        read_only: true
        volume:
          subpath: backend/api-token
      - ${ACTUNODE_SCENARIOS:-./scenarios}:/work/scenarios:ro
      - ${ACTUNODE_RESULTS:-./test-results}:/work/test-results
    depends_on:
      frontend:
        condition: service_healthy

volumes:
  # Generated credentials: MQTT logins (D-23) and the web login token (D-25). Kept across
  # `docker compose down`; `down -v` deletes them (new ones are made on the next start).
  secrets:
