# One-command local stack: docker compose up --build
# UI:      http://localhost:8080
# API:     http://localhost:8000/docs
# MQTT:    localhost:1883 (ws: 9001)
#
# Ports are published on 127.0.0.1 only: the broker accepts anonymous clients and the API has no
# login, so nothing should be reachable from the network by default. ACTUNODE_BIND_ADDRESS=0.0.0.0
# shares the lab on your network: anyone on it can then command the robots (see README).
#
# Host ports and the sessions directory can be overridden with environment variables
# (the end-to-end tests use this to run a second, isolated copy). Defaults are shown below.

services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "${ACTUNODE_BIND_ADDRESS:-127.0.0.1}:${ACTUNODE_MQTT_HOST_PORT:-1883}:1883"
      - "${ACTUNODE_BIND_ADDRESS:-127.0.0.1}:${ACTUNODE_MQTT_WS_HOST_PORT:-9001}:9001"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/broker/uptime", "-C", "1", "-W", "3"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    # Write session files as the host user, not root. Set ACTUNODE_UID/ACTUNODE_GID
    # if your user id is not 1000 (check with `id -u` and `id -g`).
    user: "${ACTUNODE_UID:-1000}:${ACTUNODE_GID:-1000}"
    environment:
      ACTUNODE_MQTT_HOST: mosquitto
      ACTUNODE_MQTT_PORT: 1883
      ACTUNODE_SESSIONS_DIR: /app/sessions
      ACTUNODE_MAX_SESSION_MB: ${ACTUNODE_MAX_SESSION_MB:-200}
    ports:
      - "${ACTUNODE_BIND_ADDRESS:-127.0.0.1}:${ACTUNODE_API_HOST_PORT:-8000}:8000"
    volumes:
      - ${ACTUNODE_SESSIONS_HOST_DIR:-./sessions}:/app/sessions
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      mosquitto:
        condition: service_healthy

  simulator:
    build:
      context: .
      dockerfile: simulator/Dockerfile
    environment:
      ACTUNODE_MQTT_HOST: mosquitto
      ACTUNODE_MQTT_PORT: 1883
      ACTUNODE_SIM_ROBOTS: ${ACTUNODE_SIM_ROBOTS:-3}
      ACTUNODE_VDA_VERSION: ${ACTUNODE_VDA_VERSION:-2}
    depends_on:
      mosquitto:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "${ACTUNODE_BIND_ADDRESS:-127.0.0.1}:${ACTUNODE_UI_HOST_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      backend:
        condition: service_healthy
