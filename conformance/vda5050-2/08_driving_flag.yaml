# VDA 5050 2.x robot conformance (D-52). The robot under test is named in `manufacturer` and `robot:` below:
# replace ROS2 / nav2_01 with yours (docs/CONNECT_YOUR_ROBOT.md). Plain VDA 5050 checks only: no ActuNode fields.
name: "08 The robot reports driving while it moves"
description: >
  Drives to Receiving Door 1, then looks back over the whole trip (a message check sees everything since the
  previous step began): at least one state must have said driving true.
manufacturer: ROS2
steps:
  - send_mission: {robot: nav2_01, destination: RECEIVING_DOOR_1, theta: 3.14, as: trip}
  - expect: {robot: nav2_01, order: trip, within: 10}
  - expect: {message: {topic: uagv/+/ROS2/nav2_01/state, match: {lastNodeId: RECEIVING_DOOR_1}}, within: 150}
  - expect: {message: {topic: uagv/+/ROS2/nav2_01/state, match: {driving: true}}, within: 1}
