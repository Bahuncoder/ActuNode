server {
  listen 80;
  # HTTPS (D-26): what people on a network use. Plain port 80 is published on 127.0.0.1 only.
  listen 443 ssl;
  ssl_certificate /etc/nginx/tls/server.crt;
  ssl_certificate_key /etc/nginx/tls/server.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS. Resolving per request (via the variable below) means a recreated
  # backend container with a new IP is picked up, instead of nginx using the IP it saw at start.
  resolver 127.0.0.11 valid=10s ipv6=off;
  server_tokens off;

  # Security headers (D-47). A location with its own add_header does not inherit these, so each location
  # repeats what applies to it. No HSTS: it is per host name, so after one visit to https://localhost:8443 a
  # browser would also force the plain local port (http://localhost:8080) onto HTTPS and break it.

  location /api/ {
    set $backend http://backend:8000;
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    # The browser's Host header as sent, port included: the backend's same-origin check needs it (D-24).
    proxy_set_header Host $http_host;
    # For the login rate limit and secure cookies (D-25). Overwrites anything the client sent.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Keep the live WebSocket open while no messages flow.
    proxy_read_timeout 1h;
    # API answers (and the interactive docs page, which loads its scripts from a CDN: no strict CSP here).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
  }

  # Session upload (D-41): the default 1 MB body limit would answer 413 before the backend sees the file.
  location = /api/sessions/upload {
    set $backend http://backend:8000;
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h;
    client_max_body_size 201m;
    client_body_timeout 30s;
    # API answers (and the interactive docs page, which loads its scripts from a CDN: no strict CSP here).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
  }

  location / {
    try_files $uri /index.html;
    # The lab UI: only its own scripts, no framing by other sites (clickjacking a logged-in user into "Inject
    # failure"). Inline style attributes are React's `style={...}`; connect-src 'self' covers the live WebSocket.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
  }
}
