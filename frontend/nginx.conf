# WebSocket upgrades keep "Connection: upgrade"; every other request to the backend says "close" instead of
# claiming an upgrade it is not asking for.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Per-client limits (one address = one client): connections include open WebSockets, so the cap leaves room for
# several tabs; the login limit slows down guessing an access token.
limit_conn_zone $binary_remote_addr zone=perclient:10m;
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

server {
  listen 80;
  # HTTPS (D-26): what people on a network use. Plain port 80 is published on 127.0.0.1 only.
  listen 443 ssl;
  ssl_certificate /etc/nginx/tls/server.crt;
  ssl_certificate_key /etc/nginx/tls/server.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  # TLS 1.2: authenticated-encryption suites only (TLS 1.3 suites are always AEAD). No session tickets: they
  # would keep one key for resumption across restarts.
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_session_tickets off;
  root /usr/share/nginx/html;
  index index.html;

  limit_conn perclient 50;

  # Docker's embedded DNS. Resolving per request (via the variable below) means a recreated
  # backend container with a new IP is picked up, instead of nginx using the IP it saw at start.
  resolver 127.0.0.11 valid=10s ipv6=off;
  server_tokens off;

  # Security headers (D-47), inherited by every location that has no add_header of its own (the API ones).
  # The UI locations add Cache-Control, so they repeat these and add the CSP. No HSTS: it is per host name, so
  # after one visit to https://localhost:8443 a browser would also force the plain local port
  # (http://localhost:8080) onto HTTPS and break it.
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  # The lab UI: only its own scripts, no framing by other sites (clickjacking a logged-in user into "Inject
  # failure"). Inline style attributes are React's `style={...}`; connect-src 'self' covers the live WebSocket.
  set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

  # Text is compressed for the UI only: API answers are not (compressing secrets next to attacker-chosen text
  # enables BREACH-style attacks).
  gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
  gzip_min_length 256;
  gzip_vary on;

  # The proxy lines every backend location shares (server level, so the locations inherit them).
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  # The browser's Host header as sent, port included: the backend's same-origin check needs it (D-24).
  proxy_set_header Host $http_host;
  # For the login rate limit and secure cookies (D-25). Overwrites anything the client sent.
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  set $backend http://backend:8000;

  # API answers (and the interactive docs page, which loads its scripts from a CDN: no strict CSP here).
  location /api/ {
    proxy_pass $backend;
  }

  # The live WebSocket stays open while no messages flow.
  location = /api/ws {
    proxy_pass $backend;
    proxy_read_timeout 1h;
  }

  location = /api/login {
    limit_req zone=login burst=5 nodelay;
    proxy_pass $backend;
  }

  # Session upload (D-41): the default 1 MB body limit would answer 413 before the backend sees the file.
  location = /api/sessions/upload {
    proxy_pass $backend;
    client_max_body_size 201m;
    client_body_timeout 30s;
    # Storing and checking a 200 MB upload can take a while after the body has arrived (D-41).
    proxy_read_timeout 300s;
  }

  # Built files carry a content hash in their name: cache for a year. A missing file is a 404, not index.html.
  location /assets/ {
    try_files $uri =404;
    gzip on;
    add_header Cache-Control "public, max-age=31536000, immutable";  # success only: a 404 is never cached
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
  }

  # index.html names the hashed files, so it must be revalidated after every deploy.
  location / {
    try_files $uri /index.html;
    gzip on;
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
  }
}
