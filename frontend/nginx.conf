server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS. Resolving per request (via the variable below) means a recreated
  # backend container with a new IP is picked up, instead of nginx using the IP it saw at start.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/ {
    set $backend http://backend:8000;
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    # For the login rate limit and secure cookies (D-25). Overwrites anything the client sent.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Keep the live WebSocket open while no messages flow.
    proxy_read_timeout 1h;
  }

  location / {
    try_files $uri /index.html;
  }
}
